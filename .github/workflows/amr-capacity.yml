name: AMR capacity validation

on:
  push:
    paths:
      - "amr_capacity_model/**"
      - ".github/workflows/amr-capacity.yml"
  pull_request:
    paths:
      - "amr_capacity_model/**"
      - ".github/workflows/amr-capacity.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amr_capacity_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: amr_capacity_model/pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Run complete validation suite
        run: python -m unittest discover -s tests -v
      - name: Generate Milestone 6 quick artifacts
        run: python scripts/run_milestone6_experiment.py --profile quick
      - name: Upload quick diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone6-quick
          path: amr_capacity_model/outputs/milestone6
          if-no-files-found: warn
